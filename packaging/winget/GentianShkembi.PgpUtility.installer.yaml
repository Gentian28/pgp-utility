# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The installer is Velopack's Setup.exe: a per-user install with a --silent switch.
PackageIdentifier: GentianShkembi.PgpUtility
PackageVersion: 1.0.0
InstallerType: exe
Scope: user
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
# Must match the Apps & Features entry the installer writes. Verify after installing a real
# release build: winget uses this to map the installed app back to the package.
AppsAndFeaturesEntries:
  - DisplayName: PGP Utility
    Publisher: Gentian Shkembi
    DisplayVersion: 1.0.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Gentian28/pgp-utility/releases/download/v1.0.0/PgpUtility-win-Setup.exe
    # TODO after the release exists: the value for PgpUtility-win-Setup.exe from
    # SHA256SUMS-win.txt on the release page, uppercase.
    InstallerSha256: TODO
# TODO: the date the v1.0.0 release is published, as YYYY-MM-DD.
ReleaseDate: TODO
ManifestType: installer
ManifestVersion: 1.10.0
