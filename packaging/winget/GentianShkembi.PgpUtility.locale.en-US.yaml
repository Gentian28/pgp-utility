License: MIT
LicenseUrl: https://github.com/Gentian28/pgp-utility/blob/main/LICENSE
ShortDescription: Local OpenPGP tool for key management, encryption, signing and verification.
Description: >-
  A desktop OpenPGP tool that runs entirely on your machine. Generate Ed25519 or RSA key pairs,
  encrypt and decrypt files and text with AES-256, sign and verify with detached or clear-signed
  signatures, and produce revocation certificates at key creation. Interoperable with GnuPG in
  both directions. Nothing is sent anywhere: there is no keyserver upload, no telemetry and no
  network use at all.
