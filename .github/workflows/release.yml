name: Release

# Tag-driven. `git tag v1.0.0 && git push --tags` builds every platform, packages installers with
# Velopack and publishes them as a draft GitHub Release.
#
# Deliberately separate from ci.yml: CI proves the code is good on every push, this produces the
# artifacts people download. Mixing them means either slow pushes or untested releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 1.0.0"
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  test:
    name: verify the exact release commit
    # Not ubuntu-latest: the GnuPG comparisons fail there for a libgcrypt defect. See ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.3xx
      - name: Require a release version tied to this commit
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          ver="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected version x.y.z"
            exit 1
          fi
          remote=$(git ls-remote --tags origin "refs/tags/v$ver" "refs/tags/v$ver^{}")
          if [ -n "$remote" ]; then
            # Checkout can create a lightweight local copy of an annotated tag. Fetch the
            # remote tag to FETCH_HEAD and peel it for the source comparison.
            git fetch --no-tags origin "refs/tags/v$ver"
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
              echo "::error::the version tag points to a different commit"
              exit 1
            fi
          fi
      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Keep GnuPG agent sockets below the OS path limit
        run: |
          mkdir -p /tmp/pgputility-test-temp
          echo 'TEMP=/tmp/pgputility-test-temp' >> "$GITHUB_ENV"
          echo 'TMP=/tmp/pgputility-test-temp' >> "$GITHUB_ENV"
          echo 'TMPDIR=/tmp/pgputility-test-temp' >> "$GITHUB_ENV"
      - name: Dependency security gate
        shell: pwsh
        run: ./scripts/check-vulnerabilities.ps1
      - name: Build with zero warnings
        run: dotnet build PgpUtility.slnx --configuration Release -warnaserror
      - name: Reject writable inline display bindings
        run: python scripts/check-display-bindings.py
      - name: Test including mandatory GnuPG comparisons
        env:
          PGPUTILITY_REQUIRE_GPG: "1"
        run: dotnet test PgpUtility.slnx --configuration Release --no-build

  package:
    name: package ${{ matrix.rid }}
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   channel: win }
          - { os: ubuntu-latest,  rid: linux-x64, channel: linux }
          # Apple silicon. The channel stays "osx" rather than "osx-arm64" so the asset names and
          # any /releases/latest/download/ URLs stay stable.
          - { os: macos-latest,   rid: osx-arm64, channel: osx }
          # Intel Macs. An osx-arm64 build will not run on them at all, because Rosetta translates
          # x64 to arm64 and not the reverse, so without this every pre-2020 Mac is unsupported.
          - { os: macos-15-intel, rid: osx-x64,   channel: osx-x64 }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.3xx

      # The tag is the single source of truth for the version. Strip the leading "v" so 1.0.0
      # reaches both the assembly and the Velopack package id.
      - name: Resolve version
        id: v
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          if [ -n "${VERSION_INPUT}" ]; then
            ver="$VERSION_INPUT"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$ver' is not x.y.z - tag as vX.Y.Z"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "building $ver for ${{ matrix.rid }}"

      # Catches the mistake that is only visible after publishing: a release with no notes, or a
      # version nobody remembered to write up. Costs a second and runs before any building.
      - name: Changelog must mention this version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ver="${{ steps.v.outputs.version }}"
          if ! grep -qE "^## +$ver( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $ver' section. Add one before releasing."
            exit 1
          fi
          echo "changelog entry for $ver found"

      - name: Install the matching Velopack CLI
        shell: pwsh
        run: |
          [xml]$packages = Get-Content Directory.Packages.props
          $version = ($packages.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'Velopack').Version
          if (-not $version) { throw 'No central Velopack version found.' }
          dotnet tool install -g vpk --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Velopack tool installation failed.' }

      # PublishSingleFile is explicitly OFF here. Velopack's delta updates diff package contents,
      # and a compressed single-file blob defeats that entirely: every update would be a full
      # download. Self-contained still applies, so no .NET runtime is needed on the user's machine.
      - name: Publish
        run: >
          dotnet publish src/PgpUtility.App
          -c Release -r ${{ matrix.rid }}
          -p:PublishSingleFile=false
          -p:Version=${{ steps.v.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libice6 libsm6 libx11-6 xvfb

      - name: Smoke test release drop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/smoke-startup.py publish/${{ matrix.rid }}/PgpUtility.App

      - name: Smoke test release drop (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          exe=PgpUtility.App
          if [ "${{ runner.os }}" = "Windows" ]; then exe=PgpUtility.App.exe; fi
          python scripts/smoke-startup.py "publish/${{ matrix.rid }}/$exe"

      - name: Package installer
        shell: bash
        # Branding flags are per-platform and vpk rejects the wrong ones outright rather than
        # ignoring them: --splashImage exists only on Windows, and macOS demands .icns and fails on
        # a .ico. Checking `vpk pack --help` on one OS is not enough.
        run: |
          brand=()
          case "${{ runner.os }}" in
            Windows)
              brand=(--icon "packaging/icon/icon.ico"
                     --splashImage "packaging/icon/splash.png"
                     --splashProgressColor "#14B8A6") ;;
            macOS)
              brand=(--icon "packaging/icon/icon.icns") ;;
            Linux)
              # No icon flag: the AppImage takes its icon from the published app and vpk's Linux
              # pack does not accept one.
              brand=() ;;
          esac

          vpk pack \
            --packId PgpUtility \
            --packVersion "${{ steps.v.outputs.version }}" \
            --packDir "publish/${{ matrix.rid }}" \
            --mainExe "$( [ "${{ runner.os }}" = "Windows" ] && echo PgpUtility.App.exe || echo PgpUtility.App )" \
            --packTitle "PGP Utility" \
            --packAuthors "Gentian Shkembi" \
            "${brand[@]}" \
            --channel "${{ matrix.channel }}" \
            --outputDir "artifacts"

      # No separate portable step: `vpk pack` already emits a Portable.zip next to the installer,
      # plus the -full.nupkg and the RELEASES / releases.<channel>.json feed that powers delta
      # updates. Adding our own zip would ship two near-identically named portable downloads.

      - name: Build synthetic migration and recovery fixture
        run: dotnet build scripts/AcceptanceFixtures -c Release -o acceptance-fixture -warnaserror

      - name: Validate the actual release installers and portable packages
        shell: bash
        run: |
          display=()
          if [ '${{ runner.os }}' = Linux ]; then display=(xvfb-run -a); fi
          "${display[@]}" python scripts/validate-package.py --artifacts artifacts --rid '${{ matrix.rid }}' \
            --fixture acceptance-fixture/AcceptanceFixtures.dll --version '${{ steps.v.outputs.version }}'

      - name: Checksums including the acceptance report
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('artifacts')
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file() and not path.name.startswith('SHA256SUMS'):
                  with path.open('rb') as source:
                      lines.append(f"{hashlib.file_digest(source, 'sha256').hexdigest()}  {path.name}")
          (root / 'SHA256SUMS-${{ matrix.channel }}.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Must come first. actions/checkout cleans the workspace, so running it after the artifacts
      # are downloaded and flattened would delete them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -la out

      # Without an explicit tag_name, action-gh-release falls back to github.ref, which on a
      # workflow_dispatch is refs/heads/main, so the release would be tagged "main".
      - name: Resolve tag
        id: v
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          if [ -n "${VERSION_INPUT}" ]; then
            ver="$VERSION_INPUT"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      # The release notes are the changelog entry, not a list of commit subjects. Commit subjects
      # describe what changed in the code; the changelog says what changed for the person reading
      # it, which is the only thing a release page is for.
      - name: Extract the changelog section
        shell: bash
        run: |
          ver="${{ steps.v.outputs.tag }}"
          ver="${ver#v}"
          awk -v v="$ver" '
            $0 ~ "^## +" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::no CHANGELOG.md section for $ver"
            exit 1
          fi
          cat NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/**
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true          # reviewed before it goes public
          body_path: NOTES.md
          fail_on_unmatched_files: true
