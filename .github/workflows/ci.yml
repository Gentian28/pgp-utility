name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. This is a backstop against a hung step burning hours of
    # runner time, which is exactly what happened the first time this workflow ran.
    timeout-minutes: 20
    strategy:
      # Don't cancel the other legs the moment one fails. When something breaks on exactly one
      # OS, the passing legs are the useful half of the signal.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The interoperability tests skip when gpg is missing, so without this the suite would go
      # green having proved nothing about the claim that is hardest to get right. Only Ubuntu
      # ships gpg ready to use.

      # Windows already has gpg inside Git for Windows, it is simply not on PATH. `choco install
      # gnupg` hung for over twenty minutes on the first run of this workflow while the other two
      # legs finished in under two, so this uses what is already on the image. It is an MSYS
      # build that rejects Windows-style paths; GnuPgRunner detects that and hands it /c/...
      # paths instead.
      - name: Put GnuPG on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Git\usr\bin"
          if (Test-Path (Join-Path $dir "gpg.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            & (Join-Path $dir "gpg.exe") --version | Select-Object -First 1
          } else {
            Write-Host "::warning::no gpg on this image, the interoperability tests will skip"
          }

      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg

      - name: Restore
        run: dotnet restore PgpUtility.slnx

      - name: Build
        run: dotnet build PgpUtility.slnx --configuration Release --no-restore

      # PGPUTILITY_REQUIRE_GPG turns a skipped interoperability test into a failure. Set on Linux
      # only, deliberately: gpg-agent is most reliable there, and one platform that is guaranteed
      # to prove interoperability on every build is worth more than three that are occasionally
      # red for reasons that have nothing to do with this code. The tests still run everywhere
      # they can; they are only mandatory here.
      - name: Test
        env:
          PGPUTILITY_REQUIRE_GPG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: dotnet test PgpUtility.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Must be unique per matrix leg: upload-artifact@v4 rejects duplicate names.
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore

  publish:
    name: publish ${{ matrix.rid }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   exe: PgpUtility.App.exe }
          - { os: ubuntu-latest,  rid: linux-x64, exe: PgpUtility.App }
          - { os: macos-latest,   rid: osx-arm64, exe: PgpUtility.App }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single file
        run: dotnet publish src/PgpUtility.App -c Release -r ${{ matrix.rid }} -o out

      # The point of the publish settings is that a user gets one file and no .NET install.
      # Assert it rather than trusting it stays true.
      - name: Verify the drop is a single file
        shell: bash
        run: |
          ls -la out
          count=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 file in the publish drop, found $count"
            find out -maxdepth 1 -type f
            exit 1
          fi
          test -f "out/${{ matrix.exe }}" || { echo "::error::${{ matrix.exe }} missing"; exit 1; }

      # Proves the binary is not merely well-formed but actually starts: the runtime boots, the
      # single-file bundle self-extracts its native libraries, and Avalonia opens a window against
      # a virtual display. Still running when the timer fires (124) is the pass condition; any
      # earlier exit means it crashed on startup. A build that compiles and then dies opening its
      # first view is exactly what this catches.
      - name: Smoke test - does it launch?
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libice6 libsm6 libx11-6 xvfb
          chmod +x out/PgpUtility.App
          set +e
          xvfb-run -a timeout 20 ./out/PgpUtility.App
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::app exited with $code instead of staying up"
            exit 1
          fi
          echo "app stayed up for the full 20s"

  vulnerable-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Fails the job if any package has a known advisory. For a crypto tool a vulnerable
      # dependency is not a maintenance chore, so this is a gate rather than a report.
      - name: Check for vulnerable packages
        run: |
          dotnet restore PgpUtility.slnx
          dotnet list PgpUtility.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi
