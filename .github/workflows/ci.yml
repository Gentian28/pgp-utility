name: CI

on:
  # Docs, design cards and markdown cannot break the build, so a change that touches nothing else
  # skips CI.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"
  # The way to ask for the installer packaging rehearsal without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request update makes the run in progress moot, so it is cancelled rather
# than left to finish. The event is part of the key so the weekly scan never cancels a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. This is a backstop against a hung step burning hours of
    # runner time, which is exactly what happened the first time this workflow ran.
    timeout-minutes: 20
    strategy:
      # Don't cancel the other legs the moment one fails. When something breaks on exactly one
      # OS, the passing legs are the useful half of the signal.
      fail-fast: false
      matrix:
        # Ubuntu stays on 24.04 because the libgcrypt 1.12.0 in 26.04 reads past the end of a
        # buffer in its Curve25519 self-test: ec_mod in mpi/ec.c widens nlimbs to the field size
        # without resizing. Whatever sits on the heap there decides whether gpg-agent accepts a
        # batch-imported Curve25519 key, and when it does not it reports "Bad passphrase". It is
        # not our keys: one GnuPG generated itself fails the same way after nothing but being
        # re-protected. Upstream fixed it in libgcrypt 1.12.1 (T8080). Move to ubuntu-latest once
        # 26.04 ships that fix, in release.yml and acceptance.yml too.
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.3xx

      - name: Keep GnuPG agent sockets below the OS path limit
        shell: pwsh
        run: |
          $directory = if ($IsWindows) { Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) 'pgputility-test-temp' } else { '/tmp/pgputility-test-temp' }
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          "TEMP=$directory" >> $env:GITHUB_ENV
          "TMP=$directory" >> $env:GITHUB_ENV
          "TMPDIR=$directory" >> $env:GITHUB_ENV

      # The interoperability tests skip when gpg is missing, so without this the suite would go
      # green having proved nothing about the claim that is hardest to get right. Only Ubuntu
      # ships gpg ready to use.

      # Windows already has gpg inside Git for Windows, it is simply not on PATH. `choco install
      # gnupg` hung for over twenty minutes on the first run of this workflow while the other two
      # legs finished in under two, so this uses what is already on the image. It is an MSYS
      # build that rejects Windows-style paths; GnuPgRunner detects that and hands it /c/...
      # paths instead.
      - name: Put GnuPG on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Git\usr\bin"
          if (Test-Path (Join-Path $dir "gpg.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            & (Join-Path $dir "gpg.exe") --version | Select-Object -First 1
          } else {
            Write-Host "::warning::no gpg on this image, the interoperability tests will skip"
          }

      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew install gnupg

      - name: Restore
        run: dotnet restore PgpUtility.slnx

      - name: Build
        run: dotnet build PgpUtility.slnx --configuration Release --no-restore -warnaserror

      - name: Reject writable inline display bindings
        run: python scripts/check-display-bindings.py

      # PGPUTILITY_REQUIRE_GPG turns a skipped interoperability test into a failure. Set on Linux
      # only, deliberately: gpg-agent is most reliable there, and one platform that is guaranteed
      # to prove interoperability on every build is worth more than three that are occasionally
      # red for reasons that have nothing to do with this code. The tests still run everywhere
      # they can; they are only mandatory here.
      - name: Test
        env:
          PGPUTILITY_REQUIRE_GPG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: dotnet test PgpUtility.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Must be unique per matrix leg: upload-artifact@v4 rejects duplicate names.
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore
          retention-days: 7

  # Pull requests and manual runs only, not every push to main. Two of these four legs are macOS,
  # the costliest runner, and release.yml packs every target and runs the native acceptance
  # fixture before anything is published, so a packaging break still cannot ship. Run CI by hand
  # before tagging to find one earlier.
  publish:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: publish ${{ matrix.rid }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   exe: PgpUtility.App.exe }
          - { os: ubuntu-latest,  rid: linux-x64, exe: PgpUtility.App }
          - { os: macos-latest,   rid: osx-arm64, exe: PgpUtility.App }
          - { os: macos-15-intel, rid: osx-x64, exe: PgpUtility.App }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.3xx

      - name: Publish self-contained single file
        run: dotnet publish src/PgpUtility.App -c Release -r ${{ matrix.rid }} -o out

      # The point of the publish settings is that a user gets one file and no .NET install.
      # Assert it rather than trusting it stays true.
      - name: Verify the drop is a single file
        shell: bash
        run: |
          ls -la out
          count=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 file in the publish drop, found $count"
            find out -maxdepth 1 -type f
            exit 1
          fi
          test -f "out/${{ matrix.exe }}" || { echo "::error::${{ matrix.exe }} missing"; exit 1; }

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libice6 libsm6 libx11-6 xvfb

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/smoke-startup.py out/${{ matrix.exe }}

      - name: Smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        run: python scripts/smoke-startup.py out/${{ matrix.exe }}

  vulnerable-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.3xx

      - name: Check for vulnerable packages
        shell: pwsh
        run: ./scripts/check-vulnerabilities.ps1
