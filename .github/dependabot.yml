version: 2
updates:
  # One pull request per ecosystem per week for minor and patch updates. Separate PRs each ran
  # the full CI matrix, three macOS jobs included, for updates that are reviewed and merged
  # together anyway. Major versions stay one PR each: they need code changes, and grouped in,
  # one of them holds every routine bump hostage.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
